<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz Português</title>
  <link rel="stylesheet" href="css/quizStyle.css">
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="container">
    <div>
      <h1 id="titulo-materia" class="port">Língua Portuguesa</h1>
      <div id="quiz"></div>
    </div>
    

    <!-- Resultado final -->
    <div id="final" style="display:none;">
      <h2>Parabéns!</h2>

      <p id="frase">"Minha pátria é a língua portuguesa."<br>Fernando Pessoa</p>
      <button id="voltar" onclick="location.reload()">Tentar novamente</button>
      <button id="p-inicial" onclick="document.location.href = 'index.html'">Voltar para página inicial</button>
    </div>
  </div>

  <div class="btn-home">
    <a href="index.html"><ion-icon name="home-outline"></ion-icon></a>
  </div>

  <script type="module" src="js/portugues.js"></script> 
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
